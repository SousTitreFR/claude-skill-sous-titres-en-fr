name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les versions, le changelog et check.py
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in */SKILL.md; do
            sv=$(grep -oP '^\s*version:\s*"?\K[0-9.]+' "$f" | head -1)
            if [ "$sv" != "$v" ]; then
              echo "::error::$f est en version $sv, le tag est $GITHUB_REF_NAME"
              exit 1
            fi
          done
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::Aucune entrée [$v] dans CHANGELOG.md"; exit 1; }
          cmp sous-titres-en-fr/check.py sous-titres-nettoyage-fr/check.py || { echo "::error::Les deux copies de check.py diffèrent"; exit 1; }

      - name: Créer un zip par skill
        run: |
          for f in */SKILL.md; do
            d=$(dirname "$f")
            zip -r "$d.zip" "$d"
          done

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" *.zip --title "$GITHUB_REF_NAME" --notes "$notes"
