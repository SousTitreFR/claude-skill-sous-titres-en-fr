name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version de SKILL.md
        run: |
          v=$(grep -oP '^\s*version:\s*"?\K[0-9.]+' sous-titres-en-fr/SKILL.md)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $v de SKILL.md"
            exit 1
          fi
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::Aucune entrée [$v] dans CHANGELOG.md"; exit 1; }

      - name: Créer le zip de la skill
        run: zip -r sous-titres-en-fr.zip sous-titres-en-fr

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" sous-titres-en-fr.zip --title "$GITHUB_REF_NAME" --notes "$notes"
